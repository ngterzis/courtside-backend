name: Deploy backend

# Builds the container image, runs DB migrations, and rolls it out to the API
# and chat Lambdas. Infra (ECR repo, Lambdas, OIDC role, migration task) lives
# in the courtside-infra repo.
#
# A deploy that fails its post-deploy health check is rolled back to the image
# that was live before it: see "Record the live images" and "Roll back" below.
# Rollback reverts code only — migrations must stay backward-compatible with the
# previous release (see README, "Migrations must be backward-compatible").
#
# Required GitHub config:
#   secrets.AWS_DEPLOY_ROLE_ARN        -> terraform output github_actions_role_arn
#   vars.FARGATE_SUBNET_ID             -> terraform output fargate_subnet_id
#   vars.FARGATE_SECURITY_GROUP_ID     -> terraform output fargate_security_group_id
#   vars.API_BASE_URL                  -> terraform output api_gateway_invoke_url
#   vars.CHAT_FUNCTION_URL             -> terraform output chat_function_url
#
# Both URLs point at the origins, not at CloudFront: a cached /api/health would
# let the CDN answer 200 for a Lambda that is failing. A trailing slash on
# either is fine — the health check strips it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: courtside-prod
  API_FUNCTION: courtside-prod-api
  CHAT_FUNCTION: courtside-prod-chat
  ECS_CLUSTER: courtside-prod-cluster
  MIGRATE_TASK_FAMILY: courtside-prod-migrate

jobs:
  # Gate: nothing is built or shipped unless the suite is green.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      # Fail before anything ships rather than after: without these URLs the
      # health check cannot run, and a deploy with no health check has no
      # rollback either.
      - name: Check deploy configuration
        run: |
          missing=()
          [ -n "${{ vars.API_BASE_URL }}" ] || missing+=(API_BASE_URL)
          [ -n "${{ vars.CHAT_FUNCTION_URL }}" ] || missing+=(CHAT_FUNCTION_URL)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Where a rollback goes back to, captured before the build so the :latest
      # tag still resolves to the currently-live image. ResolvedImageUri is the
      # digest form: rolling back by tag would be meaningless here, since the
      # build below moves :latest onto the new image.
      - name: Record the live images
        id: live
        run: |
          for fn in "$API_FUNCTION" "$CHAT_FUNCTION"; do
            aws lambda get-function --function-name "$fn" \
              --query 'Code.[ImageUri,ResolvedImageUri]' --output text
          done
          api=$(aws lambda get-function --function-name "$API_FUNCTION" \
            --query 'Code.ResolvedImageUri' --output text)
          chat=$(aws lambda get-function --function-name "$CHAT_FUNCTION" \
            --query 'Code.ResolvedImageUri' --output text)
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "chat=$chat" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        run: |
          run_output=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.FARGATE_SUBNET_ID }}],securityGroups=[${{ vars.FARGATE_SECURITY_GROUP_ID }}],assignPublicIp=ENABLED}" \
            --output json)

          task_arn=$(echo "$run_output" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "$task_arn" ]; then
            echo "::error::Failed to start migration task"
            echo "$run_output" | jq -r '.failures'
            exit 1
          fi
          echo "Started migration task: $task_arn"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"

          exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration container exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Database migration failed (exit code $exit_code) — see /ecs/courtside-prod-migrate logs"
            exit 1
          fi

      - name: Deploy to Lambda
        id: deploy
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          for fn in "$API_FUNCTION" "$CHAT_FUNCTION"; do
            echo "Updating $fn -> $IMAGE"
            aws lambda update-function-code \
              --function-name "$fn" \
              --image-uri "$IMAGE" >/dev/null
          done

          # update-function-code returns while LastUpdateStatus is still
          # InProgress. Without this wait the health check below can be served
          # by the old image and pass on code that was never exercised.
          for fn in "$API_FUNCTION" "$CHAT_FUNCTION"; do
            aws lambda wait function-updated --function-name "$fn"
          done

      - name: Health check
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CHAT_FUNCTION_URL: ${{ vars.CHAT_FUNCTION_URL }}
        run: |
          probe() {
            local name=$1 url=$2 body
            for attempt in $(seq 1 5); do
              # No -f: on a 503 we want the body, since it carries the reason
              # the check failed. A connection error still fails the call.
              body=$(curl -sS --max-time 15 "$url") || body=""
              if [ "$(printf '%s' "$body" | jq -r '.status // empty')" = "ok" ]; then
                echo "$name healthy: $body"
                return 0
              fi
              echo "$name attempt $attempt/5 not healthy${body:+: $body}"
              if [ "$attempt" -lt 5 ]; then sleep 10; fi
            done
            echo "::error::$name failed its health check after 5 attempts"
            return 1
          }

          # terraform's api_gateway_invoke_url and chat_function_url both end in
          # a slash, and "//api/health" does not match the route.
          api="${API_BASE_URL%/}/api/health"
          chat="${CHAT_FUNCTION_URL%/}/api/health"

          # Both functions run the same image, so both get probed — a deploy
          # that only breaks chat is still a broken deploy.
          probe "API" "$api"
          probe "chat" "$chat"

      # Reached only when the deploy ran and something after it failed, so the
      # broken image is live. Restores the images recorded above.
      - name: Roll back
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          API_IMAGE: ${{ steps.live.outputs.api }}
          CHAT_IMAGE: ${{ steps.live.outputs.chat }}
        run: |
          if [ -z "$API_IMAGE" ] || [ -z "$CHAT_IMAGE" ]; then
            echo "::error::No recorded images to roll back to — roll back by hand"
            exit 1
          fi

          echo "::warning::Deploy failed — rolling back to the previous images"

          aws lambda update-function-code --function-name "$API_FUNCTION" \
            --image-uri "$API_IMAGE" >/dev/null
          aws lambda update-function-code --function-name "$CHAT_FUNCTION" \
            --image-uri "$CHAT_IMAGE" >/dev/null

          for fn in "$API_FUNCTION" "$CHAT_FUNCTION"; do
            aws lambda wait function-updated --function-name "$fn"
          done

          echo "Rolled back API to:  $API_IMAGE"
          echo "Rolled back chat to: $CHAT_IMAGE"
          echo "::error::Rolled back to the previous images. The schema is still at the migrated revision — confirm it is compatible with the restored code."
